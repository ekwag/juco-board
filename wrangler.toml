# Config for the "juco-board" Worker (Workers & Pages -> juco-board). This
# name MUST match the Worker's name in the Cloudflare dashboard exactly, or
# a Git-connected build will fail -- see site/DEPLOY.md.
#
# Nothing in this file is secret -- it's safe to commit and push like any
# other file in this repo.

name = "juco-board"
main = "_worker.js"
compatibility_date = "2026-09-06"

[[rules]]
# Bundles index.html directly into this Worker as a plain string, imported
# in _worker.js via `import PAGE_HTML from "./index.html"`. Deliberately
# NOT using Workers' separate "Static Assets" ([assets]) feature -- its
# docs say the internal router that feature adds does not forward
# `ctx.access` through to the Worker script, which silently breaks
# identity on every page load. See _worker.js's docstring for the full
# explanation.
type = "Text"
globs = ["*.html"]

[[d1_databases]]
binding = "DB"
database_name = "juco-board"
database_id = "38bbb299-92f5-4a73-8808-de0dbdd78143"

[vars]
# Only used as a fallback if a request to /api/* ever omits ?board=... --
# board_app.txt always sends it, so this rarely matters. Change only if
# this exact Worker ever gets reused for a second board sharing this same
# D1 database (see "A second board sharing this database later" in
# site/DEPLOY.md).
BOARD_ID = "juco2027"

# No Access-related variables needed here -- Cloudflare Access is turned on
# for this whole Worker from its own "Access" tab in the dashboard, and
# identity reaches _worker.js through `ctx.access`, not an env var.
